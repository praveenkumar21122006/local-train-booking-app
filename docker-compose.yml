version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: train_postgres
    restart: always
    environment:
      POSTGRES_USER: train_admin
      POSTGRES_PASSWORD: train_secret
      POSTGRES_DB: train_ticketing
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: train_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  api:
    build: ./backend
    container_name: train_api
    restart: always
    ports:
      - "4000:4000"
    depends_on:
      - postgres
      - redis
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - /app/node_modules

volumes:
  pgdata:
  redisdata:
